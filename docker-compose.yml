services:

  # ── Ontology pipeline ───────────────────────────────────────────────────────
  ontology-validation:
    build: .
    container_name: ontology-validation
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      # Use the public OOPS! REST service directly.
      # If it is unreachable the validation script skips OOPS gracefully.
      - OOPS_URL=https://oops.linkeddata.es/rest
    command: python run_pipeline_for_prompts.py
